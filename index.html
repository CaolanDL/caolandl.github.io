---
<!DOCTYPE HTML>
<html>
  <head>
    <title>{{ site.title }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% include favicon.html %}
    <link rel="stylesheet" type="text/css" href="css/reset.css">
    <link rel="stylesheet" type="text/css" href="css/style.css">
    <link rel="stylesheet" type="text/css" href="css/zoom.css">
    <link href="https://fonts.googleapis.com/css?family=Lato:400,900" rel="stylesheet">
    <script src="https://use.fontawesome.com/4c9066f1a6.js"></script>
  </head>
  <body>
    <div id="container">
      <aside class="site-menu">
        <!--------------- YOUR COMPANY LOGO -------------->
        <div class="header">
          <img src="assets/CSTUDIO.png" alt="{{ site.full_name }} logo" class="site-logo">
        </div>

        <button class="menu-toggle" type="button" aria-expanded="false" aria-controls="site-nav" aria-label="Open navigation">
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
          <span class="menu-toggle__bar"></span>
        </button>

        <nav id="site-nav" class="site-nav" aria-label="Primary navigation">
          <button class="nav-button is-active" type="button" data-nav-target="gallery">Gallery</button>
          <button class="nav-button" type="button" data-nav-target="about">About</button>
          <button class="nav-button" type="button" data-nav-target="contact">Contact</button>
        </nav>
      </aside>

      <main id="content" class="content-shell">
        <section id="gallery-panel" class="content-panel is-active" data-panel="gallery" aria-label="Gallery" tabindex="-1">
          <div id="gallery"></div>
        </section>

        <section id="about-panel" class="content-panel info-panel" data-panel="about" aria-labelledby="about-title" tabindex="-1" hidden>
          <h1 id="about-title">About</h1>
          <p>
            Based in Colchester, Essex.
          </p>
          <p>
            Images with a focus on <span class="about__light">light</span> and <span class="about__colour">colour</span>.
          </p>
          <p>
            Email for enquiries and bookings.
          </p>
        </section>

        <section id="contact-panel" class="content-panel info-panel" data-panel="contact" aria-labelledby="contact-title" tabindex="-1" hidden>
          <h1 id="contact-title">Contact</h1>
          <div class="contacts-bar">
            <a href="mailto:contact@cxstudio.com" class="contacts-bar__link">
              contact@cxstudio.com
              <i class="fa fa-envelope" aria-hidden="true"></i>
            </a>
            <a href="tel:+447821264406" class="contacts-bar__link">
              +44 7821 264406
              <i class="fa fa-phone" aria-hidden="true"></i>
            </a>
            <a id="instagram" class="links__icon" href="https://www.instagram.com/{{ site.instagram }}">
                <span class="view-ig">Instagram</span>
                <i class="fa fa-instagram" aria-hidden="true"></i>
            </a>
          </div>
        </section>
      </main>
    </div>
  </body>
  <script
    src="https://code.jquery.com/jquery-3.2.1.js"
    integrity="sha256-DZAnKJ/6XZ9si04Hgrsxu/8s717jcIzLy3oi35EouyE="
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/lazyload@2.0.0-beta.2/lazyload.js"></script>
  <script src="js/transition.js"></script>
  <script src="js/zoom.min.js"></script>
  <script src="js/gallery.js"></script>
  <script>
    var COLUMNS = 'columns';
    var ROWS = 'rows';
    var SQUARES = 'squares';

    var columns = COLUMNS;
    var rows = ROWS;
    var squares = SQUARES;

    var layoutStyle = {{ site.layout_style }};

    var configuration = {
      spacing: {{ site.spacing }},
      shuffle: {{ site.shuffle }},
      columns: {{ site.columns }},
      maxHeight: {{ site.max_height }}
    };
  </script>
  <script src="js/script.js"></script>
  {% include ga.html %}
</html>
